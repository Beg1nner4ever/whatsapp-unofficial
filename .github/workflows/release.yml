name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Reproducible build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match plugin/VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=$(tr -d ' \t\r\n' < plugin/VERSION)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match plugin/VERSION ($version)"
            exit 1
          fi
      - run: scripts/check-manifests.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Rebuild; hashes must equal the committed plugin/checksums.txt
        run: scripts/build-release.sh --verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/whatsapp-unofficial_darwin_arm64
            dist/whatsapp-unofficial_darwin_amd64
            dist/whatsapp-unofficial_linux_amd64
            dist/whatsapp-unofficial_linux_arm64
            dist/whatsapp-unofficial_windows_amd64.exe
            dist/checksums.txt

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Check downloaded assets against checksums.txt
        working-directory: dist
        run: sha256sum --strict -c checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          gh release create "$TAG" --repo "$REPO" --verify-tag \
            --title "whatsapp-unofficial $TAG" \
            --notes "Unofficial, community-built WhatsApp integration (not affiliated with WhatsApp or Meta). Binaries are reproducible: scripts/build-release.sh --verify rebuilds them from this tag and checks them against checksums.txt." \
            dist/whatsapp-unofficial_darwin_arm64 \
            dist/whatsapp-unofficial_darwin_amd64 \
            dist/whatsapp-unofficial_linux_amd64 \
            dist/whatsapp-unofficial_linux_arm64 \
            dist/whatsapp-unofficial_windows_amd64.exe \
            dist/checksums.txt
